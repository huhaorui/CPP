<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A chubby bear eating salmon</title>
  <desc id="desc">A playful illustration of a big, round bear enjoying a salmon in a meadow.</desc>
  <defs>
